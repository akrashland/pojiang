<script>
(function () {
  var svg  = document.getElementById('tagsvg');
  var cord = document.getElementById('cord');
  var tag  = document.getElementById('tag');
  if (!svg || !cord || !tag) return;

  var ANCHOR = { x: 210, y: 8 };   // 挂钉位置
  var N = 9;                        // 绳子节点数
  var SEG = 19;                     // 每段长度
  var MAXLEN = (N - 1) * SEG;       // 绳子总长（拖拽时不许超过）
  var GRAVITY = 0.55;
  var DAMPING = 0.985;

  var pts = [];
  for (var i = 0; i < N; i++) {
    pts.push({ x: ANCHOR.x, y: ANCHOR.y + i * SEG,
               px: ANCHOR.x, py: ANCHOR.y + i * SEG });
  }

  function draw() {
    var d = 'M';
    for (var i = 0; i < N; i++) {
      d += (i ? 'L' : '') + pts[i].x.toFixed(2) + ',' + pts[i].y.toFixed(2);
    }
    cord.setAttribute('d', d);
    var a = pts[N - 2], b = pts[N - 1];
    var ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI - 90;
    tag.setAttribute('transform',
      'translate(' + b.x.toFixed(2) + ',' + b.y.toFixed(2) + ') rotate(' + ang.toFixed(2) + ')');
  }

  // 系统里关掉了动效 → 静止挂着，不做物理
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (still) { draw(); return; }

  var dragging = false, drag = { x: 0, y: 0 };

  function step() {
    // 惯性
    for (var i = 1; i < N; i++) {
      var p = pts[i];
      var vx = (p.x - p.px) * DAMPING;
      var vy = (p.y - p.py) * DAMPING;
      p.px = p.x; p.py = p.y;
      p.x += vx; p.y += vy + GRAVITY;
    }
    // 约束：固定挂钉、保持段长、拖拽时锁住末端
    for (var k = 0; k < 24; k++) {
      pts[0].x = ANCHOR.x; pts[0].y = ANCHOR.y;
      if (dragging) { pts[N - 1].x = drag.x; pts[N - 1].y = drag.y; }
      for (var j = 0; j < N - 1; j++) {
        var a = pts[j], b = pts[j + 1];
        var dx = b.x - a.x, dy = b.y - a.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 0.0001;
        var f = ((dist - SEG) / dist) * 0.5;
        var ox = dx * f, oy = dy * f;
        if (j !== 0)                        { a.x += ox; a.y += oy; }
        if (!(dragging && j + 1 === N - 1)) { b.x -= ox; b.y -= oy; }
      }
    }
    draw();
    raf = requestAnimationFrame(step);
  }

  function toSvg(e) {
    var pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }

  svg.addEventListener('pointerdown', function (e) {
    dragging = true;
    svg.classList.add('dragging');
    if (svg.setPointerCapture) svg.setPointerCapture(e.pointerId);
    var p = toSvg(e);
    drag.x = p.x; drag.y = p.y;
    e.preventDefault();
  });

  svg.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var p = toSvg(e);
    // 不许拽出绳长
    var dx = p.x - ANCHOR.x, dy = p.y - ANCHOR.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist > MAXLEN) { p.x = ANCHOR.x + dx / dist * MAXLEN; p.y = ANCHOR.y + dy / dist * MAXLEN; }
    drag.x = p.x; drag.y = p.y;
  });

  function release(e) {
    if (!dragging) return;
    dragging = false;
    svg.classList.remove('dragging');
    if (svg.releasePointerCapture && e.pointerId !== undefined) {
      try { svg.releasePointerCapture(e.pointerId); } catch (err) {}
    }
  }
  svg.addEventListener('pointerup', release);
  svg.addEventListener('pointercancel', release);

  // 开场轻轻荡一下
  pts[N - 1].px -= 17;

  var raf = requestAnimationFrame(step);

  // 切到别的标签页就停，省电
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { cancelAnimationFrame(raf); }
    else { raf = requestAnimationFrame(step); }
  });
})();
</script>
</body>
